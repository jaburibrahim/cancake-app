<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F6EEE3">
<title>CanCake — بكل وقت.. بكل مكان</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Outfit:wght@400;500;600;700&family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --vanilla:#F6EEE3;
    --cream:#FFFDF8;
    --espresso:#2E211A;
    --espresso-soft:#4A3A2F;
    --brass:#B5893C;
    --brass-light:#D9BC7E;
    --brass-deep:#8C6A2E;
    --line:rgba(46,33,26,.14);
    --display:'Fraunces', Georgia, serif;
    --body:'Outfit', system-ui, sans-serif;
    --arabic:'Readex Pro', 'Segoe UI', Tahoma, sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;background:var(--vanilla);color:var(--espresso);
    font-family:var(--arabic);line-height:1.45;-webkit-font-smoothing:antialiased;
  }
  button,input,textarea{font:inherit;color:inherit;}

  /* ============================================================
     MOBILE-FIRST BASE — comfortable, single column, natural scroll.
     This is what most customers (on phones) will see.
     ============================================================ */

  .page{
    max-width:640px;margin:0 auto;
    display:flex;flex-direction:column;gap:16px;
    padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  }

  .topbar{display:flex;align-items:center;justify-content:center;gap:9px;padding:2px 0;flex-wrap:wrap;}
  .topbar .logo-img{height:32px;width:auto;display:block;}
  .topbar .tag{font-family:var(--arabic);font-weight:600;font-size:12px;color:var(--brass-deep);margin-inline-start:7px;padding-inline-start:8px;border-inline-start:1px solid var(--line);}

  .builder{display:flex;flex-direction:column;gap:16px;}
  .col-flavor{order:1;}
  .col-addon{order:2;}
  .col-box{order:3;}

  .col{
    background:var(--cream);border:1.5px solid var(--line);border-radius:16px;
    padding:16px;
  }
  .col-head{font-family:var(--arabic);font-weight:700;font-size:15px;color:var(--espresso-soft);text-align:center;padding-bottom:9px;margin-bottom:11px;border-bottom:1px solid var(--line);letter-spacing:.02em;}

  .list-wrap{display:flex;flex-direction:column;gap:8px;}
  .flavor-row,.addon-row{
    display:flex;align-items:center;gap:12px;width:100%;
    padding:10px 12px;border-radius:12px;border:1.5px solid transparent;
    background:rgba(255,255,255,.55);cursor:pointer;text-align:start;
    min-height:46px;
    transition:background .15s ease, border-color .15s ease;
  }
  .flavor-row.selected,.addon-row.selected{background:#fff;border-color:var(--brass);box-shadow:0 0 0 2px rgba(181,137,60,.15);}
  .row-label{flex:1;min-width:0;font-size:14px;line-height:1.3;}
  .row-label b{font-family:var(--body);font-weight:600;font-size:14px;color:var(--espresso);}
  .row-label .ar{color:var(--espresso-soft);font-size:12.5px;margin-inline-start:2px;}
  .row-price{font-family:var(--body);font-weight:600;font-size:13px;color:var(--brass-deep);white-space:nowrap;flex-shrink:0;}
  .row-check{width:19px;height:19px;flex-shrink:0;color:var(--brass);}
  .row-check svg{width:14px;height:14px;display:block;}

  .can-shape{
    --c1:#ccc;--c2:#999;width:34px;height:44px;border-radius:8px 8px 4px 4px;flex-shrink:0;
    background:linear-gradient(180deg,var(--c1),var(--c2));position:relative;
    box-shadow:inset -3px 0 5px rgba(0,0,0,.18), inset 2px 0 3px rgba(255,255,255,.22);
  }
  .can-shape::before{content:'';position:absolute;top:-2px;left:50%;transform:translateX(-50%);width:88%;height:6px;border-radius:50%;background:rgba(255,255,255,.4);border:1px solid rgba(0,0,0,.1);}
  .can-shape::after{content:'';position:absolute;top:36%;left:0;right:0;height:25%;background:rgba(255,253,248,.24);border-top:1px solid rgba(255,255,255,.35);border-bottom:1px solid rgba(0,0,0,.14);}

  .jar-shape{
    width:38px;height:44px;border-radius:6px 6px 14px 14px;flex-shrink:0;
    background:linear-gradient(180deg, rgba(255,255,255,.92), rgba(255,255,255,.62));
    border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;
    position:relative;color:var(--espresso-soft);
  }
  .jar-shape::before{content:'';position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:58%;height:7px;border-radius:2px;background:var(--brass);}
  .jar-shape svg{width:21px;height:21px;display:block;}

  .box-visual{width:100%;max-width:300px;margin:2px auto 8px;}
  .box-body{
    position:relative;aspect-ratio:16/9.3;
    background:linear-gradient(160deg,#fff,var(--vanilla));
    border:1.5px solid var(--line);border-radius:14px;
    box-shadow:0 8px 18px rgba(46,33,26,.1), inset 0 1px 0 rgba(255,255,255,.7);
  }
  .box-wordmark{position:absolute;top:9px;left:50%;transform:translateX(-50%);font-family:var(--display);font-weight:600;font-style:italic;font-size:13px;color:var(--brass-deep);white-space:nowrap;}
  .box-window{
    position:absolute;top:58%;transform:translateY(-50%);width:34%;aspect-ratio:1;border-radius:50%;
    background:var(--vanilla);border:2.5px dashed rgba(46,33,26,.22);
    display:flex;align-items:center;justify-content:center;overflow:hidden;
    transition:border-color .3s ease, background .3s ease;
  }
  .box-window.filled{border-style:solid;border-color:var(--brass);background:#fff;}
  .box-window.flavor{right:7%;}
  .box-window.addon{left:7%;}
  .box-window .placeholder{font-size:19px;font-weight:300;color:rgba(46,33,26,.22);}
  .box-ribbon{position:absolute;bottom:-11px;left:50%;transform:translateX(-50%);width:46px;height:22px;color:var(--brass);}
  .box-caption{text-align:center;font-family:var(--display);font-style:italic;font-size:13px;color:var(--espresso-soft);margin-bottom:10px;min-height:16px;}

  .mini-head{font-family:var(--arabic);font-size:13px;font-weight:700;color:var(--espresso-soft);margin-bottom:8px;display:flex;align-items:center;gap:7px;}
  .mini-head .opt{font-weight:400;font-size:11px;background:rgba(46,33,26,.06);padding:2px 8px;border-radius:20px;}

  .chip-row{display:flex;gap:8px;margin-bottom:9px;}
  .custom-chip{
    flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
    padding:9px 6px;border-radius:11px;border:1.5px solid var(--line);
    background:rgba(255,255,255,.55);cursor:pointer;text-align:center;
    min-height:46px;
  }
  .custom-chip.selected{background:#fff;border-color:var(--brass);box-shadow:0 0 0 2px rgba(181,137,60,.15);}
  .custom-chip .chip-name{font-size:13px;font-weight:600;color:var(--espresso);}
  .custom-chip .chip-price{font-size:11.5px;color:var(--brass-deep);font-family:var(--body);font-weight:600;}
  .custom-input{
    width:100%;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;
    font-family:var(--arabic);font-size:13.5px;background:#fff;resize:vertical;
    min-height:52px;margin-bottom:9px;
  }
  .custom-input:focus{border-color:var(--brass);outline:none;}

  .addr-field{margin-bottom:10px;}
  .addr-field label{display:block;font-family:var(--arabic);font-size:13px;font-weight:700;color:var(--espresso-soft);margin-bottom:4px;}
  .addr-field input{width:100%;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;font-family:var(--arabic);font-size:14px;background:#fff;min-height:44px;}
  .addr-field input:focus{border-color:var(--brass);outline:none;}
  .addr-row{display:flex;flex-direction:column;gap:0;}
  .addr-row .addr-field{flex:1;min-width:0;}

  .cart-list{margin-bottom:9px;}
  .cart-list[hidden]{display:none;}
  .cart-row{display:flex;align-items:center;gap:8px;padding:7px 3px;font-size:13.5px;border-bottom:1px dashed var(--line);}
  .cart-num{width:20px;height:20px;border-radius:50%;background:var(--brass);color:#fff;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cart-label{flex:1;min-width:0;color:var(--espresso-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .cart-price{font-family:var(--body);font-weight:600;color:var(--brass-deep);white-space:nowrap;flex-shrink:0;}
  .cart-del{background:none;border:none;color:var(--espresso-soft);font-size:18px;line-height:1;cursor:pointer;padding:4px 6px;flex-shrink:0;}
  .cart-del:active{color:#B23A3A;}

  .add-box-btn{
    width:100%;padding:11px 8px;border-radius:11px;
    border:1.5px dashed var(--brass);background:rgba(181,137,60,.07);
    color:var(--brass-deep);font-family:var(--arabic);font-weight:700;font-size:13.5px;
    cursor:pointer;margin-bottom:10px;min-height:44px;
  }
  .add-box-btn:active{opacity:.75;}

  .price-row{display:flex;justify-content:space-between;align-items:center;font-size:13.5px;padding:4px 0;color:var(--espresso-soft);}
  .price-row b{font-family:var(--body);font-weight:600;color:var(--espresso);}
  .muted{color:rgba(46,33,26,.4);font-style:normal;}
  .price-total{display:flex;justify-content:space-between;align-items:center;font-family:var(--display);font-weight:600;font-size:20px;padding-top:8px;margin-top:4px;border-top:1px solid var(--line);}
  .price-total span:last-child{color:var(--brass-deep);}

  .btn-row{display:flex;gap:8px;margin-top:11px;}
  .btn-primary,.btn-secondary{flex:1;padding:13px 10px;border-radius:12px;font-family:var(--arabic);font-weight:700;font-size:14px;cursor:pointer;border:1.5px solid transparent;min-height:46px;}
  .btn-primary{background:var(--espresso);color:var(--vanilla);}
  .btn-secondary{background:transparent;border-color:var(--line);color:var(--espresso);}
  .btn-primary:active,.btn-secondary:active{opacity:.8;}
  .reset-link{display:block;text-align:center;margin-top:8px;background:none;border:none;color:var(--espresso-soft);font-family:var(--arabic);font-size:12.5px;text-decoration:underline;cursor:pointer;padding:4px;}

  .manual-copy{margin-top:9px;}
  .manual-copy[hidden]{display:none;}
  .manual-copy-label{font-family:var(--arabic);font-size:12px;color:var(--brass-deep);margin:0 0 5px;}
  #manualCopyText{width:100%;min-height:70px;border:1.5px solid var(--brass);border-radius:10px;padding:8px 10px;font-family:var(--body);font-size:12.5px;background:#fff;resize:vertical;}

  button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brass);outline-offset:1px;}

  .toast{
    position:fixed;bottom:calc(18px + env(safe-area-inset-bottom));left:50%;
    transform:translateX(-50%) translateY(14px);
    background:var(--espresso);color:var(--vanilla);padding:11px 20px;border-radius:30px;
    font-family:var(--arabic);font-size:13px;opacity:0;pointer-events:none;z-index:60;white-space:nowrap;
    transition:opacity .25s ease, transform .25s ease;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ============================================================
     WIDER SCREENS (tablets/desktop, 700px+) — compact 3-column,
     everything on one screen, no page scroll. Same idea as before,
     just scoped to viewports spacious enough to actually fit it.
     ============================================================ */
  @media(min-width:700px){
    html,body{height:100%;}
    body{overflow:hidden;}

    .page{
      height:100vh;height:100dvh;max-width:920px;
      justify-content:center;gap:6px;
      padding:8px 9px calc(8px + env(safe-area-inset-bottom));
    }

    .topbar{padding:2px 0 4px;}
    .topbar .logo-img{height:27px;}
    .topbar .tag{font-size:10.5px;margin-inline-start:6px;padding-inline-start:7px;}

    .builder{
      flex:0 1 auto;min-height:0;
      display:grid;grid-template-columns:0.95fr 1.18fr 0.95fr;gap:7px;
      direction:ltr;
    }
    .col-flavor{order:1;}
    .col-box{order:2;}
    .col-addon{order:3;}

    .col{
      min-height:0;display:flex;flex-direction:column;
      padding:9px;direction:rtl;overflow:hidden;border-radius:13px;
    }
    .col-box{overflow-y:auto;}
    .col-head{font-size:11.5px;padding-bottom:5px;margin-bottom:5px;}

    .list-wrap{flex:1;min-height:0;overflow-y:auto;justify-content:center;gap:3px;}
    .flavor-row,.addon-row{gap:6px;padding:4.5px 6px;border-radius:8px;min-height:0;}
    .row-label{font-size:10.5px;}
    .row-label b{font-size:10.5px;}
    .row-label .ar{font-size:9.5px;}
    .row-price{font-size:9.5px;}
    .row-check{width:13px;height:13px;}
    .row-check svg{width:10px;height:10px;}

    .can-shape{width:22px;height:29px;border-radius:5px 5px 3px 3px;}
    .can-shape::before{height:4px;}
    .can-shape::after{height:24%;}
    .jar-shape{width:25px;height:29px;border-radius:4px 4px 9px 9px;}
    .jar-shape::before{top:-4px;height:5px;}
    .jar-shape svg{width:14px;height:14px;}

    .box-visual{width:80%;max-width:none;margin:1px auto 3px;}
    .box-body{border-radius:11px;}
    .box-wordmark{top:5px;font-size:9px;}
    .box-window{width:35%;border-width:2px;}
    .box-window .placeholder{font-size:13px;}
    .box-ribbon{bottom:-7px;width:30px;height:15px;}
    .box-caption{font-size:9.5px;margin-bottom:5px;min-height:12px;}

    .mini-head{font-size:9.5px;margin-bottom:4px;gap:5px;}
    .mini-head .opt{font-size:8.5px;padding:1px 6px;}

    .chip-row{gap:5px;margin-bottom:5px;}
    .custom-chip{padding:4.5px 3px;border-radius:8px;min-height:0;}
    .custom-chip .chip-name{font-size:9px;}
    .custom-chip .chip-price{font-size:8px;}
    .custom-input{padding:4px 6px;font-size:9.5px;min-height:26px;margin-bottom:5px;border-radius:7px;}

    .addr-row{flex-direction:row;gap:6px;}
    .addr-field{margin-bottom:6px;}
    .addr-field label{font-size:9.5px;margin-bottom:2px;}
    .addr-field input{padding:5px 7px;font-size:10.5px;border-radius:7px;min-height:0;}

    .cart-list{margin-bottom:5px;}
    .cart-row{padding:3px 2px;font-size:9.5px;gap:5px;}
    .cart-num{width:14px;height:14px;font-size:8px;}
    .cart-del{font-size:12px;padding:2px 3px;}

    .add-box-btn{padding:5.5px 6px;font-size:9.5px;border-radius:8px;margin-bottom:6px;min-height:0;}

    .price-row{font-size:10px;padding:2px 0;}
    .price-total{font-size:14px;padding-top:4px;margin-top:2px;}

    .btn-row{gap:5px;margin-top:6px;}
    .btn-primary,.btn-secondary{padding:6.5px 4px;border-radius:8px;font-size:10px;min-height:0;}
    .reset-link{margin-top:4px;font-size:9px;}

    .manual-copy{margin-top:5px;}
    .manual-copy-label{font-size:8.5px;}
    #manualCopyText{min-height:40px;padding:4px 6px;font-size:9px;border-radius:7px;}

    .toast{bottom:calc(14px + env(safe-area-inset-bottom));padding:9px 18px;font-size:12px;}

    ::-webkit-scrollbar{width:4px;height:4px;}
    ::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
  }

  @media(prefers-reduced-motion: reduce){*{transition:none !important;animation:none !important;}}
</style>
</head>

    bouquet: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="15" r="4"/><circle cx="20" cy="11" r="4.2"/><circle cx="27" cy="15" r="4"/><path d="M13 18 L18 31 M20 15.5 L20 31 M27 18 L22 31"/><path d="M15 27 L25 27" stroke-width="3"/></svg>',
    bear: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="13" cy="9" r="3.1"/><circle cx="27" cy="9" r="3.1"/><circle cx="20" cy="16" r="7.3"/><circle cx="20" cy="26.5" r="9.3"/><circle cx="17" cy="15" r=".9" fill="currentColor" stroke="none"/><circle cx="23" cy="15" r=".9" fill="currentColor" stroke="none"/><circle cx="20" cy="18.3" r="1" fill="currentColor" stroke="none"/></svg>',
    coffee: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 15h18v9a9 9 0 0 1-9 9 9 9 0 0 1-9-9v-9z"/><path d="M27 17.5h2.5a4 4 0 0 1 0 8H27"/><path d="M13.5 5c0 2 2 2 2 4M19.5 5c0 2 2 2 2 4"/></svg>',
    can: '<svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="12" y="7" width="16" height="26" rx="3.5"/><ellipse cx="20" cy="7" rx="8" ry="2.1"/><circle cx="16" cy="16" r="1" fill="currentColor" stroke="none"/><circle cx="24" cy="21" r="1" fill="currentColor" stroke="none"/><circle cx="17" cy="26" r="1" fill="currentColor" stroke="none"/></svg>'
  };

  var flavors = [
    {id:'pistachio', en:'Pistachio', ar:'بستاشيو', c1:'#8CA576', c2:'#5F7A4C'},
    {id:'strawberry', en:'Strawberry', ar:'فراولة', c1:'#C4506B', c2:'#7D2B41'},
    {id:'toffee-lotus', en:'Toffee & Lotus', ar:'توفي ولوتس', c1:'#D9BC7E', c2:'#8C6A2E'},
    {id:'cappuccino', en:'Cappuccino', ar:'كابتشينو', c1:'#4A3A2F', c2:'#2E211A'},
    {id:'hazelnut', en:'Hazelnut', ar:'بندق', c1:'#4A6E96', c2:'#233C57'},
    {id:'kinder-bueno', en:'Kinder Bueno', ar:'كيندر بوينو', c1:'#F1E4C8', c2:'#C9A56C'}
  ];

  var addons = [
    {id:'fish', name:'سمكة', price:10000, icon:'fish'},
    {id:'rose', name:'وردة', price:7500, icon:'rose'},
    {id:'handmade-rose', name:'وردة صناعة يدوية', price:7500, icon:'rose2'},
    {id:'mini-roses', name:'ميني روز', price:7500, icon:'bouquet'},
    {id:'teddy', name:'دبدوب', price:7500, icon:'bear'},
    {id:'coffee', name:'قهوة', price:5000, icon:'coffee'},
    {id:'soda', name:'مشروب غازي', price:2000, icon:'can', note:'بيبسي، كولا، وغيرها'}
  ];

  var customs = [
    {id:'card', name:'كارت إهداء شخصي', short:'كارت', price:1000, desc:'أضف رسالتك الخاصة', placeholder:'اكتب رسالتك هنا…'},
    {id:'printing', name:'طباعة على العلبة', short:'طباعة', price:1000, desc:'أضف اسمًا أو عبارة أو شعارًا أو تصميمًا خاصًا', placeholder:'مثال: مبروك التخرج!'}
  ];

  var state = {
    flavor: null,
    addon: null,
    customs: {card:false, printing:false},
    cardMsg: '',
    printText: '',
    address: '',
    deliveryDate: '',
    cart: []
  };

  function $(id){ return document.getElementById(id); }

  function escapeHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  function fmt(n){
    if(n===null || n===undefined || isNaN(n)) n = 0;
    return Number(n).toLocaleString('en-US') + ' د.ع';
  }
  function fmtNum(n){
    if(n===null || n===undefined || isNaN(n)) n = 0;
    return Number(n).toLocaleString('en-US');
  }
  function formatDateDisplay(iso){
    if(!iso) return '';
    var p = iso.split('-');
    if(p.length !== 3) return iso;
    return p[2] + '/' + p[1] + '/' + p[0];
  }

  function findFlavor(id){ for(var i=0;i<flavors.length;i++){ if(flavors[i].id===id) return flavors[i]; } return null; }
  function findAddon(id){ for(var i=0;i<addons.length;i++){ if(addons[i].id===id) return addons[i]; } return null; }

  function boxSubtotal(box){
    var sub = 0;
    var a = findAddon(box.addon);
    if(a) sub += a.price;
    customs.forEach(function(c){ if(box.customs && box.customs[c.id]) sub += c.price; });
    return sub;
  }
  function cartSubtotal(){
    var sum = 0;
    state.cart.forEach(function(box){ sum += boxSubtotal(box); });
    return sum;
  }
  function hasValidOrder(){
    return state.cart.length > 0 || !!(state.flavor && state.addon);
  }

  function computeTotal(){
    var total = DELIVERY_COST;
    total += cartSubtotal();
    if(state.addon){
      total += boxSubtotal({addon: state.addon, customs: state.customs});
    }
    return total;
  }

  /* ---------------- render pieces ---------------- */

  function renderFlavorList(){
    $('flavorList').innerHTML = flavors.map(function(f){
      var sel = state.flavor === f.id;
      return '' +
        '<button type="button" class="flavor-row' + (sel?' selected':'') + '" onclick="CanCakeBuilder.selectFlavor(\'' + f.id + '\')" aria-pressed="' + sel + '">' +
          '<span class="can-shape" style="--c1:' + f.c1 + ';--c2:' + f.c2 + '"></span>' +
          '<span class="row-label"><b lang="en">' + f.en + '</b> <span class="ar">' + f.ar + '</span></span>' +
          '<span class="row-check">' + (sel?CHECK_SVG:'') + '</span>' +
        '</button>';
    }).join('');
  }

  function renderAddonList(){
    $('addonList').innerHTML = addons.map(function(a){
      var sel = state.addon === a.id;
      var titleAttr = a.note ? (' title="' + a.note + '"') : '';
      return '' +
        '<button type="button" class="addon-row' + (sel?' selected':'') + '"' + titleAttr + ' onclick="CanCakeBuilder.selectAddon(\'' + a.id + '\')" aria-pressed="' + sel + '">' +
          '<span class="jar-shape">' + ICONS[a.icon] + '</span>' +
          '<span class="row-label"><b>' + a.name + '</b></span>' +
          '<span class="row-price">' + fmtNum(a.price) + '</span>' +
          '<span class="row-check">' + (sel?CHECK_SVG:'') + '</span>' +
        '</button>';
    }).join('');
  }

  function renderCustomChips(){
    $('customChips').innerHTML = customs.map(function(c){
      var sel = !!state.customs[c.id];
      return '' +
        '<button type="button" class="custom-chip' + (sel?' selected':'') + '" title="' + c.name + ' — ' + c.desc + '" onclick="CanCakeBuilder.toggleCustom(\'' + c.id + '\')" aria-pressed="' + sel + '">' +
          '<span class="chip-name">' + c.short + '</span>' +
          '<span class="chip-price">+' + fmtNum(c.price) + '</span>' +
        '</button>';
    }).join('');

    var inputsHtml = '';
    customs.forEach(function(c){
      if(!state.customs[c.id]) return;
      var val = c.id === 'card' ? state.cardMsg : state.printText;
      var handler = c.id === 'card' ? 'onCardMsgInput' : 'onPrintTextInput';
      inputsHtml += '<textarea class="custom-input" placeholder="' + c.placeholder + '" oninput="CanCakeBuilder.' + handler + '(this.value)">' + escapeHtml(val) + '</textarea>';
    });
    $('customInputs').innerHTML = inputsHtml;
  }

  function renderBoxStage(){
    var f = findFlavor(state.flavor);
    var a = findAddon(state.addon);
    var wf = $('windowFlavor'), wa = $('windowAddon');

    if(f){
      wf.innerHTML = '<span class="can-shape" style="--c1:' + f.c1 + ';--c2:' + f.c2 + '"></span>';
      wf.classList.add('filled');
    } else {
      wf.innerHTML = '<span class="placeholder">+</span>';
      wf.classList.remove('filled');
    }

    if(a){
      wa.innerHTML = '<span class="jar-shape">' + ICONS[a.icon] + '</span>';
      wa.classList.add('filled');
    } else {
      wa.innerHTML = '<span class="placeholder">+</span>';
      wa.classList.remove('filled');
    }

    var caption = $('boxCaption');
    if(!f && !a) caption.innerHTML = '<em>Start with 1 CanCake</em>';
    else if(f && !a) caption.innerHTML = '<em>' + f.ar + ' — اختر إضافتك</em>';
    else caption.innerHTML = '<em>' + f.ar + ' + ' + a.name + '</em>';
  }

  function renderCart(){
    var el = $('cartList');
    if(state.cart.length === 0){
      el.hidden = true;
      el.innerHTML = '';
      return;
    }
    el.hidden = false;
    el.innerHTML = state.cart.map(function(box, idx){
      var f = findFlavor(box.flavor);
      var a = findAddon(box.addon);
      var label = (f?f.ar:'') + ' + ' + (a?a.name:'');
      return '<div class="cart-row"><span class="cart-num">' + (idx+1) + '</span>' +
        '<span class="cart-label">' + label + '</span>' +
        '<span class="cart-price">' + fmt(boxSubtotal(box)) + '</span>' +
        '<button type="button" class="cart-del" onclick="CanCakeBuilder.removeCartItem(' + idx + ')" aria-label="حذف">✕</button>' +
        '</div>';
    }).join('');
  }

  function renderPriceBox(){
    var a = findAddon(state.addon);
    var chosenCustoms = customs.filter(function(c){ return state.customs[c.id]; });

    var html = '';
    if(state.cart.length > 0){
      html += '<div class="price-row"><span>' + state.cart.length + ' بوكس مضاف مسبقًا</span><b>' + fmt(cartSubtotal()) + '</b></div>';
    }
    if(a){
      html += '<div class="price-row"><span>البوكس الحالي — ' + a.name + '</span><b>' + fmt(a.price) + '</b></div>';
    } else if(state.cart.length === 0){
      html += '<div class="price-row"><span class="muted">اختر الإضافة</span></div>';
    }
    chosenCustoms.forEach(function(c){
      html += '<div class="price-row"><span>' + c.short + '</span><b>' + fmt(c.price) + '</b></div>';
    });
    html += '<div class="price-row"><span>التوصيل</span><b>' + fmt(DELIVERY_COST) + '</b></div>';
    html += '<div class="price-total"><span>الإجمالي</span><span>' + fmt(computeTotal()) + '</span></div>';

    $('priceBox').innerHTML = html;
  }

  function render(){
    renderFlavorList();
    renderAddonList();
    renderCustomChips();
    renderBoxStage();
    renderCart();
    renderPriceBox();
  }

  /* ---------------- actions ---------------- */

  function selectFlavor(id){ state.flavor = id; render(); }
  function selectAddon(id){ state.addon = id; render(); }
  function toggleCustom(id){ state.customs[id] = !state.customs[id]; render(); }

  function onCardMsgInput(val){ state.cardMsg = val; }
  function onPrintTextInput(val){ state.printText = val; }
  function onAddressInput(val){ state.address = val; }
  function onDateInput(val){ state.deliveryDate = val; }

  function addAnotherBox(){
    if(!state.flavor || !state.addon){ showToast('اختر النكهة والإضافة أولاً'); return; }
    state.cart.push({
      flavor: state.flavor,
      addon: state.addon,
      customs: {card: state.customs.card, printing: state.customs.printing},
      cardMsg: state.cardMsg,
      printText: state.printText
    });
    state.flavor = null;
    state.addon = null;
    state.customs = {card:false, printing:false};
    state.cardMsg = '';
    state.printText = '';
    render();
    showToast('أُضيف البوكس ✓ — كوّن البوكس التالي');
  }

  function removeCartItem(idx){
    state.cart.splice(idx, 1);
    render();
  }

  function resetAll(){
    state = {flavor:null, addon:null, customs:{card:false, printing:false}, cardMsg:'', printText:'', address:'', deliveryDate:'', cart:[]};
    var mc = $('manualCopy'); if(mc) mc.hidden = true;
    var addrInput = $('addressInput'); if(addrInput) addrInput.value = '';
    var dateInput = $('dateInput'); if(dateInput) dateInput.value = '';
    render();
  }

  function buildSummaryText(){
    var lines = [];
    lines.push('طلب CanCake 🍰');

    var allBoxes = state.cart.slice();
    if(state.flavor && state.addon){
      allBoxes.push({flavor:state.flavor, addon:state.addon, customs:state.customs, cardMsg:state.cardMsg, printText:state.printText});
    }

    allBoxes.forEach(function(box, idx){
      var f = findFlavor(box.flavor);
      var a = findAddon(box.addon);
      lines.push('');
      lines.push('بوكس ' + (idx+1) + ':');
      lines.push('النكهة: ' + (f ? (f.en + ' / ' + f.ar) : '—'));
      lines.push('الإضافة: ' + (a ? (a.name + ' (' + fmt(a.price) + ')') : '—'));
      customs.forEach(function(c){
        if(!box.customs || !box.customs[c.id]) return;
        var extra = '';
        if(c.id === 'card' && box.cardMsg) extra = ' — «' + box.cardMsg + '»';
        if(c.id === 'printing' && box.printText) extra = ' — «' + box.printText + '»';
        lines.push(c.name + ' (' + fmt(c.price) + ')' + extra);
      });
    });

    lines.push('');
    lines.push('التوصيل: ' + fmt(DELIVERY_COST));
    lines.push('العنوان: ' + (state.address ? state.address : '—'));
    lines.push('تاريخ التوصيل: ' + (state.deliveryDate ? formatDateDisplay(state.deliveryDate) : '—'));
    lines.push('الإجمالي: ' + fmt(computeTotal()));
    return lines.join('\n');
  }

  var toastTimer;
  function showToast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function legacyCopy(text){
    var ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.top = '-9999px';
    ta.style.left = '-9999px';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    try{ ta.setSelectionRange(0, text.length); }catch(e){}
    var ok = false;
    try{ ok = document.execCommand('copy'); }catch(e){ ok = false; }
    document.body.removeChild(ta);
    return ok;
  }

  function showManualCopyFallback(text){
    var wrap = $('manualCopy');
    var ta = $('manualCopyText');
    ta.value = text;
    wrap.hidden = false;
    ta.focus();
    ta.select();
    showToast('انسخ النص يدويًا أدناه');
  }

  function copySummary(){
    if(!hasValidOrder()){ showToast('اختر النكهة والإضافة أولاً'); return; }
    var text = buildSummaryText();

    function onCopyOk(){ $('manualCopy').hidden = true; showToast('تم نسخ الطلب ✓'); }

    if(navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext){
      navigator.clipboard.writeText(text).then(onCopyOk).catch(function(){
        if(legacyCopy(text)) onCopyOk();
        else showManualCopyFallback(text);
      });
    } else if(legacyCopy(text)){
      onCopyOk();
    } else {
      showManualCopyFallback(text);
    }
  }

  function shareWhatsApp(){
    if(!hasValidOrder()){ showToast('اختر النكهة والإضافة أولاً'); return; }
    var text = buildSummaryText();
    window.open('https://wa.me/' + WA_NUMBER + '?text=' + encodeURIComponent(text), '_blank', 'noopener');
  }

  window.CanCakeBuilder = {
    selectFlavor: selectFlavor,
    selectAddon: selectAddon,
    toggleCustom: toggleCustom,
    onCardMsgInput: onCardMsgInput,
    onPrintTextInput: onPrintTextInput,
    onAddressInput: onAddressInput,
    onDateInput: onDateInput,
    addAnotherBox: addAnotherBox,
    removeCartItem: removeCartItem,
    resetAll: resetAll,
    copySummary: copySummary,
    shareWhatsApp: shareWhatsApp
  };

  (function initDateMin(){
    var d = new Date();
    var mm = String(d.getMonth()+1).padStart(2,'0');
    var dd = String(d.getDate()).padStart(2,'0');
    var iso = d.getFullYear() + '-' + mm + '-' + dd;
    var dateInput = $('dateInput');
    if(dateInput) dateInput.min = iso;
  })();

  render();
})();
</script>
</body>
</html>
